name: Deploy to Staging

on:
  workflow_dispatch:
  push:
    branches: [develop/v1, staging]
    paths:
      - 'copilot-dispatch-backend/**'
      - '.github/workflows/deploy-staging.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copilot-dispatch-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: copilot-dispatch-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp package.json package-lock.json deploy/
          cd deploy && npm ci --omit=dev
          cd ..
          cd deploy && zip -r ../deploy.zip . && cd ..

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name copilot-dispatch-staging \
            --resource-group copilot-dispatch-rg \
            --src-path deploy.zip \
            --type zip
